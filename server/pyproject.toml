[project]
name = "autoalfred-server"
version = "0.1.0"
description = "AutoAlfred — serveur : agent, mémoire, traces, versioning du harness, évaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "anyio"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoalfred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
